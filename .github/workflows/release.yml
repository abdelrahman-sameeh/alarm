name: Android APK Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run android:apk
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "alarm-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: alarm-${{ github.ref_name }}
          path: alarm-${{ github.ref_name }}.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "alarm-${GITHUB_REF_NAME}.apk" --generate-notes --title "alarm $GITHUB_REF_NAME"
